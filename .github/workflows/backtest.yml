name: CRT backtest

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of history"
        default: "5"
      extra_pairs:
        description: "Add 6 more pairs for more trades (yes or no)"
        default: "no"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python backtest.py
        env:
          BACKTEST_YEARS: ${{ github.event.inputs.years }}
          BACKTEST_EXTRA: ${{ github.event.inputs.extra_pairs }}
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
