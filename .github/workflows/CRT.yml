name: CRT signal bot

on:
  schedule:
    - cron: "*/30 * * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "run or test"
        default: "run"

permissions:
  contents: write

concurrency:
  group: crt-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py ${{ github.event.inputs.mode }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        run: |
          git config user.name "crt-bot"
          git config user.email "crt-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
